<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grafana mock webhook</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5d6573; --border: #e1e4ea;
  --accent: #f46800; --accent-text: #ffffff; --ok: #1a7f37; --ok-bg: #e6f4ea; --bad: #c62828; --bad-bg: #fdecea;
  --code-bg: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1a1d23; --text: #e8eaee; --muted: #9aa3b2; --border: #2c3039;
    --accent: #ff8a33; --accent-text: #16181d; --ok: #57c975; --ok-bg: #16301e; --bad: #ff6b6b; --bad-bg: #3a1a1a;
    --code-bg: #12151a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 28px 0 12px; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
p.lead { margin: 0 0 16px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input[type=url], textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
}
textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; min-height: 180px; resize: vertical; }
.target-row input { flex: 1 1 260px; }
button {
  font: inherit; font-weight: 600; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--border); background: var(--card); color: var(--text); min-height: 40px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .55; cursor: default; }
.meta { color: var(--muted); font-size: 14px; margin-top: 10px; }
.meta b { color: var(--text); font-weight: 600; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.scenario { display: flex; flex-direction: column; gap: 8px; }
.scenario h3 { margin: 0; font-size: 15px; }
.scenario p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.scenario .row button { flex: 1; }
.msg { margin-top: 8px; font-size: 14px; min-height: 20px; }
.msg.bad { color: var(--bad); }
.log { display: flex; flex-direction: column; gap: 8px; }
.log details { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
.log summary { list-style: none; cursor: pointer; padding: 10px 12px; display: grid; gap: 4px 10px; grid-template-columns: auto 1fr auto; align-items: center; }
.log summary::-webkit-details-marker { display: none; }
.pill { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.log .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log .time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.log .sub { grid-column: 1 / -1; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.log .body { padding: 0 12px 12px; display: grid; gap: 10px; }
.log .body h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
pre { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 10px; overflow: auto; max-height: 360px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 12px 0; }
dialog { border: 1px solid var(--border); border-radius: 12px; padding: 0; width: min(760px, calc(100vw - 32px)); background: var(--card); color: var(--text); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
dialog header h3 { margin: 0; font-size: 15px; }
dialog pre { border-radius: 0; max-height: 70dvh; }
details.custom > summary { cursor: pointer; font-weight: 600; }
details.custom[open] > summary { margin-bottom: 12px; }
</style>
</head>
<body>
<main>
  <h1>Grafana mock webhook</h1>
  <p class="lead">Шлёт на ваш сервис вебхуки в том же формате, что и Grafana Alerting на larek.tech. Алерты выдуманные, формат — настоящий.</p>

  <section class="card">
    <form class="row target-row" id="target-form">
      <input type="url" id="target" required placeholder="http://host.docker.internal:8080/webhooks/grafana" aria-label="Адрес вашего сервиса">
      <button class="primary" type="submit">Сохранить адрес</button>
    </form>
    <div class="meta" id="state-line"></div>
    <div class="row" style="margin-top:10px">
      <button type="button" id="auto-btn" hidden></button>
    </div>
    <div class="msg" id="target-msg"></div>
  </section>

  <h2>Сценарии</h2>
  <div class="grid" id="scenarios"></div>

  <h2>Свой JSON</h2>
  <details class="card custom">
    <summary>Отправить произвольный запрос</summary>
    <textarea id="raw" spellcheck="false" placeholder='Вставьте JSON или нажмите «JSON» у сценария и скопируйте его сюда'></textarea>
    <div class="row" style="margin-top:10px">
      <button class="primary" type="button" id="raw-send">Отправить</button>
    </div>
    <div class="msg" id="raw-msg"></div>
  </details>

  <h2>Отправки <button type="button" id="clear-btn">Очистить</button></h2>
  <div class="log" id="log"></div>
</main>

<dialog id="preview">
  <header>
    <h3 id="preview-title"></h3>
    <div class="row">
      <button type="button" id="copy-btn">Копировать</button>
      <button type="button" id="to-raw-btn">В «Свой JSON»</button>
      <button type="button" id="close-btn">Закрыть</button>
    </div>
  </header>
  <pre id="preview-body"></pre>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const openIds = new Set();
let lastLogKey = "";
let state = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || "Сервис не ответил");
  return data;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const authText = { none: "без авторизации", basic: "Basic-авторизация", header: "заголовок Authorization" };

async function loadState() {
  state = await api("/api/state");
  if (document.activeElement !== $("target")) $("target").value = state.target;
  let line = `Отправка: <b>${esc(authText[state.auth])}</b>. `;
  if (!state.sequence || state.sequence.length === 0) {
    line += "Автоотправка выключена — отправляйте сценарии кнопками.";
    $("auto-btn").hidden = true;
  } else if (state.auto) {
    const secs = Math.max(0, Math.round((new Date(state.nextAt) - Date.now()) / 1000));
    line += `Автоотправка каждые <b>${esc(state.interval)}</b>, следующий — <code>${esc(state.next)}</code> через ${secs} с.`;
    $("auto-btn").hidden = false;
    $("auto-btn").textContent = "Поставить автоотправку на паузу";
  } else {
    line += "Автоотправка на паузе.";
    $("auto-btn").hidden = false;
    $("auto-btn").textContent = "Продолжить автоотправку";
  }
  $("state-line").innerHTML = line;
}

async function loadScenarios() {
  const list = await api("/api/scenarios");
  $("scenarios").innerHTML = list.map((s) => `
    <div class="card scenario">
      <h3>${esc(s.title)}</h3>
      <div><code>${esc(s.name)}</code></div>
      <p>${esc(s.description)}</p>
      <div class="row">
        <button class="primary" type="button" data-send="${esc(s.name)}">Отправить</button>
        <button type="button" data-show="${esc(s.name)}" data-title="${esc(s.title)}">JSON</button>
      </div>
      <div class="msg" data-msg="${esc(s.name)}"></div>
    </div>`).join("");
}

function resultText(d) {
  if (d.error) return `Не доставлено: ${d.error}`;
  return `Ответ ${d.statusCode} за ${d.durationMs} мс` + (d.attempts > 1 ? `, попыток: ${d.attempts}` : "");
}

async function send(name, btn) {
  const msg = document.querySelector(`[data-msg="${CSS.escape(name)}"]`);
  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Отправляю…";
  try {
    const d = await api(`/api/send/${encodeURIComponent(name)}`, { method: "POST" });
    msg.className = d.ok ? "msg" : "msg bad";
    msg.textContent = resultText(d);
    loadLog();
  } catch (e) {
    msg.className = "msg bad";
    msg.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
}

async function showPayload(name, title) {
  const res = await fetch(`/api/scenarios/${encodeURIComponent(name)}`);
  $("preview-title").textContent = title;
  $("preview-body").textContent = await res.text();
  $("preview").showModal();
}

function prettyJSON(s) {
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; }
}

async function loadLog() {
  const list = await api("/api/deliveries");
  const key = list.map((d) => d.id).join(",");
  if (key === lastLogKey) return;
  lastLogKey = key;
  if (list.length === 0) {
    $("log").innerHTML = '<div class="empty">Пока ничего не отправлено.</div>';
    return;
  }
  $("log").innerHTML = list.map((d) => `
    <details data-id="${d.id}" ${openIds.has(d.id) ? "open" : ""}>
      <summary>
        <span class="pill ${d.ok ? "ok" : "bad"}">${d.error ? "ошибка" : d.statusCode}</span>
        <span class="name">${esc(d.scenario)}</span>
        <span class="time">${new Date(d.at).toLocaleTimeString("ru-RU")}</span>
        <span class="sub">${d.source === "auto" ? "авто" : "вручную"} · ${d.durationMs} мс${d.attempts > 1 ? ` · попыток: ${d.attempts}` : ""} · ${esc(d.target)}${d.error ? ` · ${esc(d.error)}` : ""}</span>
      </summary>
      <div class="body">
        <div><h4>Ответ сервиса</h4><pre>${esc(d.response || "(пусто)")}</pre></div>
        <div><h4>Отправленный JSON</h4><pre>${esc(prettyJSON(d.request))}</pre></div>
      </div>
    </details>`).join("");
}

document.addEventListener("click", (e) => {
  const sendBtn = e.target.closest("[data-send]");
  if (sendBtn) return send(sendBtn.dataset.send, sendBtn);
  const showBtn = e.target.closest("[data-show]");
  if (showBtn) return showPayload(showBtn.dataset.show, showBtn.dataset.title);
});

$("log").addEventListener("toggle", (e) => {
  const id = Number(e.target.dataset.id);
  if (e.target.open) openIds.add(id); else openIds.delete(id);
}, true);

$("target-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("target-msg");
  try {
    await api("/api/target", { method: "POST", body: JSON.stringify({ url: $("target").value.trim() }) });
    msg.className = "msg";
    msg.textContent = "Адрес сохранён.";
    $("target").blur();
    loadState();
  } catch (err) {
    msg.className = "msg bad";
    msg.textContent = err.message;
  }
});

$("auto-btn").addEventListener("click", async () => {
  await api("/api/auto", { method: "POST", body: JSON.stringify({ enabled: !state.auto }) });
  loadState();
});

$("raw-send").addEventListener("click", async () => {
  const msg = $("raw-msg");
  const btn = $("raw-send");
  btn.disabled = true;
  try {
    const d = await api("/api/send-raw", { method: "POST", body: $("raw").value });
    msg.className = d.ok ? "msg" : "msg bad";
    msg.textContent = resultText(d);
    loadLog();
  } catch (err) {
    msg.className = "msg bad";
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

$("clear-btn").addEventListener("click", async () => {
  await fetch("/api/deliveries", { method: "DELETE" });
  openIds.clear();
  loadLog();
});

$("close-btn").addEventListener("click", () => $("preview").close());
$("copy-btn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("preview-body").textContent);
    $("copy-btn").textContent = "Скопировано";
  } catch {
    $("copy-btn").textContent = "Не удалось";
  }
  setTimeout(() => ($("copy-btn").textContent = "Копировать"), 1500);
});
$("to-raw-btn").addEventListener("click", () => {
  $("raw").value = $("preview-body").textContent;
  $("preview").close();
  document.querySelector("details.custom").open = true;
  $("raw").scrollIntoView({ behavior: "smooth", block: "center" });
});

loadScenarios();
loadState();
loadLog();
setInterval(() => { loadState().catch(() => {}); loadLog().catch(() => {}); }, 2000);
</script>
</body>
</html>
